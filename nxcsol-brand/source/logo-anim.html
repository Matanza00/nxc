:root { --ink: #eef2fa; --blue: #3d7efc; --bg: #07090e; --fs: 160px; }
html, body { margin: 0; height: 100%; background: var(--bg); }
html.transparent, html.transparent body { background: transparent; }
body.light { --ink: #0b1020; }
.stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
.halo { position: absolute; left: 50%; top: 50%; width: 900px; height: 520px; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(closest-side, rgba(61, 126, 252, .16), rgba(61, 126, 252, 0)); opacity: 0; }
html.transparent .halo { display: none; }
.logo { position: relative; display: inline-flex; align-items: center; gap: .14em; font: 700 var(--fs) / 1 "Saira SC", sans-serif; letter-spacing: .02em; color: var(--ink); will-change: transform; }
.logo > span, .logo > i { display: block; will-change: transform, opacity; }
.bar { width: .2em; height: 1.02em; border-radius: 99px; background: var(--blue); margin: 0 .16em 0 .2em; transform: skewX(-21deg); }
.sol { color: var(--blue); }
.ring { position: absolute; left: 0; top: 50%; width: 1em; height: 1em; margin: -.5em 0 0 -.5em; border-radius: 50%; border: .035em solid var(--blue); opacity: 0; pointer-events: none; }
.spark { position: absolute; left: 0; top: 50%; width: .5em; height: .5em; margin: -.25em 0 0 -.25em; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, #fff, rgba(143, 179, 255, .8) 40%, rgba(61, 126, 252, 0)); }
</style>
</head>
<body>
<div class="stage"><div class="halo"></div><div class="logo" id="logo"><span class="nxc">NXC</span><i class="bar"></i><span class="sol">SOL</span><i class="ring"></i><i class="spark"></i></div></div>
<script>
const Q = new URLSearchParams(location.search);
if (Q.has("transparent")) document.documentElement.classList.add("transparent");
if (Q.has("light")) document.body.classList.add("light");
if (Q.has("fs")) document.documentElement.style.setProperty("--fs", Q.get("fs") + "px");
const $ = (s) => document.querySelector(s);
const logo = $("#logo"), nxc = $(".nxc"), bar = $(".bar"), sol = $(".sol"), ring = $(".ring"), spark = $(".spark"), halo = $(".halo");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (k) => 1 - Math.pow(1 - k, 3), inCubic = (k) => k * k * k, inOut = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const outBack = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const spring = (tau, w = 26, z = 6) => (tau <= 0 ? 0 : 1 - Math.exp(-z * tau) * Math.cos(w * tau));   // 0 -> 1 with a damped overshoot

const DUR = 5.6, HIT = 2.95;
let em = 160, ram = 0;
// how far NXC travels to touch the upright bar (layout boxes, so the bar's resting slant doesn't count)
function measure() { em = parseFloat(getComputedStyle(logo).fontSize); ram = bar.offsetLeft + bar.offsetWidth * 0.1 - (nxc.offsetLeft + nxc.offsetWidth); }

function render(t) {
  // 1. NXC and SOL arrive from either side, with a gap between them
  const a = outCubic(seg(t, 0.05, 0.6));
  let nx = (1 - a) * -0.35 * em, sx = (1 - a) * 0.35 * em, no = a, so = a;
  // 2. a straight bar drops into the gap
  const d = seg(t, 1.0, 1.45);
  let by = (1 - outBack(d, 2.2)) * -1.3 * em, bo = clamp(d * 3), skew = 0, bx = 0, bright = 1;
  // 3. SOL slides away
  const e = inCubic(seg(t, 2.0, 2.4));
  sx += e * 0.9 * em; so *= 1 - e;
  // 4. NXC winds back, then rams the bar
  nx += -0.16 * em * outCubic(seg(t, 2.4, 2.72));
  nx += (0.16 * em + ram) * inCubic(seg(t, 2.72, HIT));
  // the hit: the bar tips into the slash with an overshoot, and NXC recoils into place
  const tau = t - HIT;
  if (tau > 0) {
    skew = -21 * spring(tau, 24, 5.5);
    bx = 0.07 * em * Math.exp(-7 * tau) * Math.sin(Math.min(tau * 18, Math.PI));
    nx = ram * (1 - outBack(seg(t, HIT, HIT + 0.42), 1.4));
    bright = 1 + 1.4 * Math.exp(-9 * tau);
  }
  // 5. SOL comes back, and the whole mark settles
  const r = seg(t, 3.3, 3.85);
  if (t >= 3.3) { sx = (1 - outBack(r, 1.6)) * 0.9 * em; so = clamp(r * 2.2); }
  // impact extras: a ring, a spark and a short shake
  const ri = seg(t, HIT, HIT + 0.55), sh = tau > 0 ? Math.exp(-14 * tau) : 0;
  const shx = sh * 0.035 * em * Math.sin(tau * 90), shy = sh * 0.02 * em * Math.cos(tau * 77);
  // a soft glow on the finished mark, and a fade at the very end so the loop restarts cleanly
  const glow = Math.sin(Math.PI * seg(t, 3.85, 5.2)) * 0.55, out = 1 - inOut(seg(t, 5.32, 5.6));

  nxc.style.transform = `translate3d(${nx.toFixed(2)}px,0,0)`; nxc.style.opacity = no.toFixed(3);
  sol.style.transform = `translate3d(${sx.toFixed(2)}px,0,0)`; sol.style.opacity = so.toFixed(3);
  bar.style.transform = `translate3d(${bx.toFixed(2)}px,${by.toFixed(2)}px,0) skewX(${skew.toFixed(2)}deg)`; bar.style.opacity = bo.toFixed(3);
  bar.style.filter = `brightness(${bright.toFixed(3)})` + (glow > 0.01 ? ` drop-shadow(0 0 ${(glow * 0.12 * em).toFixed(1)}px rgba(61,126,252,${(glow * 0.9).toFixed(2)}))` : "");
  const cx = bar.offsetLeft + bar.offsetWidth / 2;
  ring.style.left = spark.style.left = cx + "px";
  ring.style.opacity = tau > 0 ? ((1 - ri) * 0.85).toFixed(3) : "0"; ring.style.transform = `scale(${(0.3 + 2.4 * outCubic(ri)).toFixed(3)})`;
  spark.style.opacity = tau > 0 ? clamp(1 - tau / 0.28).toFixed(3) : "0"; spark.style.transform = `scale(${(0.6 + 2.2 * outCubic(seg(t, HIT, HIT + 0.28))).toFixed(3)})`;
  logo.style.transform = `translate3d(${shx.toFixed(2)}px,${shy.toFixed(2)}px,0)`; logo.style.opacity = out.toFixed(3);
  halo.style.opacity = (Math.min(a, out) * (0.55 + glow * 0.8)).toFixed(3);
}

window.ready = document.fonts.ready.then(() => { measure(); render(Q.has("still") ? 5.25 : 0); });
window.render = render; window.DUR = DUR;
if (!Q.has("still") && !Q.has("capture")) {   // live preview when the file is opened in a browser
  window.ready.then(() => { const t0 = performance.now(); const loop = (now) => { render(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
</body>
</html>
